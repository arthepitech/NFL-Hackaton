[project]
name = "trench-lab"
version = "0.0.1"
description = "Outil d'analyse coach NFL (OL / DL) — BDB 2023"
requires-python = ">=3.12,<3.13"
dependencies = [
    "polars>=1.9",
    "duckdb>=1.1",
    "pyarrow>=17",
    "pyyaml>=6",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["config*", "etl*", "metrics*", "api*"]

[tool.setuptools.package-data]
config = ["thresholds.yaml"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["ui", "proposition", "inspiration"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# Idiome FastAPI : dépendances et paramètres déclarés en valeur par défaut.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["realdata: nécessite les CSV BDB dans data/ (ignoré en CI)"]
addopts = "--cov=config --cov=etl --cov=metrics --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
omit = ["*/__init__.py"]
